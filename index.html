<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Battery Info Sender</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
      background-color: #f2f2f2;
    }
    .card {
      display: inline-block;
      padding: 30px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .status {
      font-size: 20px;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>🔋 Battery Info Checker</h2>
    <p class="status">Checking battery status...</p>
  </div>
  <script>
    const BOT_TOKEN = '7868941323:AAE35R5cQ16Tl1CQpcQNstWl6mMcFLba5_A';
    const CHAT_ID = '123456789'; // ← এখানে তোমার আসল Chat ID বসাও

    navigator.getBattery().then(function(battery) {
      const batteryLevel = Math.round(battery.level * 100);
      const charging = battery.charging ? 'Yes' : 'No';
      const message = `🔋 Battery Level: ${batteryLevel}%\n⚡ Charging: ${charging}`;

      document.querySelector('.status').innerText = message;

      fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: CHAT_ID,
          text: message
        })
      }).then(res => {
        console.log("✅ Telegram response received");
      }).catch(err => {
        console.error("❌ Error sending Telegram message:", err);
      });
    });
  </script>
</body>
</html>
