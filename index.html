
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>📸 Camera & Location Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      padding: 30px;
      text-align: center;
    }
    .form-container {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      max-width: 450px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, textarea, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    button {
      background: green;
      color: white;
      cursor: pointer;
    }
    .status {
      margin-top: 15px;
      color: green;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>📋 ফর্ম: ছবি ও লোকেশন সহ</h2>
    <input type="text" id="name" placeholder="👤 নাম লিখুন" required>
    <input type="text" id="phone" placeholder="📱 মোবাইল নাম্বার লিখুন" required>
    <select id="option">
      <option value="">🔽 অপশন বেছে নিন</option>
      <option value="জরুরি">🟥 জরুরি</option>
      <option value="সাধারণ">🟨 সাধারণ</option>
      <option value="অন্যান্য">⬜ অন্যান্য</option>
    </select>
    <textarea id="message" rows="3" placeholder="📝 আপনার বার্তা লিখুন"></textarea>

    <input type="file" id="image" accept="image/*" capture="environment">
    <button onclick="getLocation()">📍 লোকেশন যোগ করুন</button>
    <button onclick="sendMessage()">✅ ফর্ম সাবমিট করুন</button>

    <div class="status" id="status"></div>
  </div>

  <script>
    const BOT_TOKEN = '7868941323:AAE35R5cQ16Tl1CQpcQNstWl6mMcFLba5_A';
    const CHAT_ID = '1054739462';
    let userLocation = "";

    function getLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(position) {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          userLocation = `https://www.google.com/maps?q=${lat},${lon}`;
          document.getElementById("status").innerText = "✅ লোকেশন যুক্ত হয়েছে";
        }, function(error) {
          document.getElementById("status").innerText = "❌ লোকেশন পাওয়া যায়নি";
        });
      } else {
        document.getElementById("status").innerText = "❌ আপনার ব্রাউজারে GPS নেই";
      }
    }

    function sendMessage() {
      const name = document.getElementById("name").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const option = document.getElementById("option").value;
      const msg = document.getElementById("message").value.trim();
      const imageFile = document.getElementById("image").files[0];

      if (!name || !phone || !option) {
        document.getElementById("status").innerText = "⚠️ নাম, মোবাইল ও অপশন আবশ্যক";
        return;
      }

      const text = `📥 নতুন ফর্ম:
👤 নাম: ${name}
📱 মোবাইল: ${phone}
📌 অপশন: ${option}
📝 বার্তা: ${msg || "বার্তা নেই"}
🌍 লোকেশন: ${userLocation || "লোকেশন দেওয়া হয়নি"}`;

      // Step 1: Send text
      fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          chat_id: CHAT_ID,
          text: text
        })
      }).then(res => {
        if (res.ok && imageFile) {
          // Step 2: Send photo
          const formData = new FormData();
          formData.append("chat_id", CHAT_ID);
          formData.append("photo", imageFile);

          fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
            method: "POST",
            body: formData
          }).then(photoRes => {
            if (photoRes.ok) {
              document.getElementById("status").innerText = "✅ বার্তা ও ছবি পাঠানো হয়েছে!";
            } else {
              document.getElementById("status").innerText = "✅ বার্তা পাঠানো হয়েছে, কিন্তু ছবি যায়নি।";
            }
          });
        } else if (!imageFile) {
          document.getElementById("status").innerText = "✅ বার্তা সফলভাবে পাঠানো হয়েছে!";
        } else {
          document.getElementById("status").innerText = "❌ সমস্যা হয়েছে!";
        }
      }).catch(err => {
        document.getElementById("status").innerText = "🚫 নেটওয়ার্ক সমস্যা!";
        console.error(err);
      });
    }
  </script>
</body>
</html>
